services:
  backend:
    build: ./backend
    container_name: portfolio-backend
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: portfolio-frontend
    ports:
      - "8083:80"
    depends_on:
      - backend
    restart: unless-stopped
